name: Compile LaTeX to PDF

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "subjects/**/*.pdf"
      - "subjects/**/*.tex"
      - "preamble.tex"
      - "scripts/update_progress.py"
      - ".github/workflows/compile-latex.yml"
  pull_request:
    branches: [main]
    paths:
      - "subjects/**/*.tex"
      - "preamble.tex"
      - "scripts/update_progress.py"

concurrency:
  group: latex-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-lang-cyrillic \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-pictures \
            texlive-science

      - name: Compile every subject
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            directory="$(dirname "$file")"
            filename="$(basename "$file")"
            (
              cd "$directory"
              latexmk -pdf -interaction=nonstopmode -halt-on-error "$filename"
              latexmk -c "$filename"
            )
          done < <(find subjects -type f -name '*.tex' -print0 | sort -z)

      - name: Update lecture progress tables
        run: python scripts/update_progress.py

      - name: Upload PDFs for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: compiled-conspects
          path: subjects/**/*.pdf

      - name: Commit rebuilt PDFs and progress tables
        if: github.event_name == 'push'
        run: |
          git config user.name "actions-user"
          git config user.email "65916846+actions-user@users.noreply.github.com"
          git add 'subjects/**/*.pdf' index.html README.md
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild lecture PDFs and update progress"
          git push

      - name: Prepare the Pages site
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir _site
          cp index.html _site/
          find subjects -type f -name '*.pdf' -exec cp --parents -t _site/ -- {} +

      - name: Upload the Pages site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
